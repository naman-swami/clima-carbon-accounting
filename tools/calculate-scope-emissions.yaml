annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Convert fuel consumption, utility kWh, and refrigerant losses into metric
  tons of CO2 equivalent.
input_schema:
  additionalProperties: false
  properties:
    consumption_quantity:
      type: number
    fuel_type:
      type: string
    unit:
      type: string
  required:
  - fuel_type
  - consumption_quantity
  - unit
  type: object
name: calculate-scope-emissions
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
